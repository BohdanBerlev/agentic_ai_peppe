name: Agentic Issue Reviewer (Google Gemini)

on:
  issues:
    types: [opened, edited, pinned]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub Issue Number to process"
        required: true
        default: "1"
        type: string

jobs:
  run-gemini-pipeline:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pipeline mit Google AI Studio ausführen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unterstützt alle gebräuchlichen Secret-Namen in GitHub Repository Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.LLM_API_KEY || secrets.AI_STUDIO_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY || secrets.LLM_API_KEY || secrets.AI_STUDIO_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.AI_STUDIO_API_KEY }}
          LLM_PROVIDER: "google"
          # gemini-1.5-flash bietet 15 RPM im Free-Tier (im Gegensatz zu nur 2 RPM bei pro) - verhindert 429 Quota-Fehler
          LLM_MODEL: "gemini-1.5-flash"
          PYTHONPATH: "."
        run: |
          # Ermittelt die Issue-Nummer entweder aus dem Webhook-Event oder dem manuellen Input
          TARGET_ISSUE="${{ github.event.issue.number }}"
          if [ -z "$TARGET_ISSUE" ]; then
            TARGET_ISSUE="${{ github.event.inputs.issue_number }}"
          fi
          
          echo "Running pipeline for issue number: $TARGET_ISSUE"
          python -m src.workflows.run_github_issue --issue-number "$TARGET_ISSUE"
