# All twelve roles must be covered.
# A human may be accountable for multiple roles.
#
# End of Session 2 / Session 3:
# - 4 human team members -> at least 8 roles operationally supported by an
#   agent or hybrid implementation with distinct role-specific behavior,
#   outputs, tests, and trace role tags.

roles:
  - id: managing_director_customer_lead
    title: Managing Director / Customer Lead
    responsibility: Customer communication, priorities, company-level decisions
    current_actor_type: human
    current_actor: Mehrose Farooq
    target_actor_type: human
    target_actor: Mehrose Farooq
    supporting_agent: none
    accountable_human: Mehrose Farooq
    human_approval_required: true
    implementation_status: planned

  - id: product_owner_requirements
    title: Product Owner / Requirements Engineer
    responsibility: Requirements, user stories, acceptance criteria, backlog value
    current_actor_type: agent
    current_actor: requirements_agent (run_requirements_analysis)
    target_actor_type: agent
    target_actor: requirements_agent
    supporting_agent: requirements_agent
    accountable_human: Mehrose Farooq
    human_approval_required: true
    implementation_status: operational

  - id: project_manager
    title: Project Manager
    responsibility: Planning, task allocation, Work Packages (WPs), dependencies, delivery risk
    current_actor_type: hybrid
    current_actor: requirements_agent (run_project_planning)
    target_actor_type: hybrid
    target_actor: requirements_agent
    supporting_agent: requirements_agent
    accountable_human: Lars Boos
    human_approval_required: false
    implementation_status: operational

  - id: software_architect
    title: Software Architect
    responsibility: System architecture, interfaces, ADRs, technical standards
    current_actor_type: agent
    current_actor: architect_agent (run_architect_review)
    target_actor_type: agent
    target_actor: architect_agent
    supporting_agent: architect_agent
    accountable_human: David Pisarkiewicz
    human_approval_required: true
    implementation_status: operational

  - id: backend_api_engineer
    title: Backend / API Engineer
    responsibility: FastAPI services, business logic, API contracts
    current_actor_type: human
    current_actor: Maxim Bers
    target_actor_type: hybrid
    target_actor: implementation_agent
    supporting_agent: none
    accountable_human: Maxim Bers
    human_approval_required: false
    implementation_status: planned

  - id: data_rag_engineer
    title: Data & RAG Engineer
    responsibility: PostgreSQL, pgvector, ingestion, chunking, retrieval, embeddings
    current_actor_type: human
    current_actor: Maxim Bers
    target_actor_type: hybrid
    target_actor: implementation_agent
    supporting_agent: none
    accountable_human: Maxim Bers
    human_approval_required: false
    implementation_status: planned

  - id: agent_engineer
    title: Agent Engineer
    responsibility: LangGraph workflows, LangChain integration, agent state and tools
    current_actor_type: hybrid
    current_actor: requirements_agent (run_agent_engineering_spec)
    target_actor_type: hybrid
    target_actor: requirements_agent
    supporting_agent: requirements_agent
    accountable_human: David Pisarkiewicz
    human_approval_required: false
    implementation_status: operational

  - id: integration_engineer
    title: Integration Engineer
    responsibility: Agent-to-agent and agent-to-system interfaces and handovers
    current_actor_type: hybrid
    current_actor: integration_agent (run_integration_check)
    target_actor_type: hybrid
    target_actor: integration_agent
    supporting_agent: integration_agent
    accountable_human: David Pisarkiewicz
    human_approval_required: false
    implementation_status: operational

  - id: qa_test_engineer
    title: QA & Test Engineer
    responsibility: pytest execution, regression testing, agent evaluation, quality evidence
    current_actor_type: agent
    current_actor: qa_security_agent (run_qa_test_execution)
    target_actor_type: agent
    target_actor: qa_security_agent
    supporting_agent: qa_security_agent
    accountable_human: Lars Boos
    human_approval_required: true
    implementation_status: operational

  - id: devops_engineer
    title: DevOps Engineer
    responsibility: Docker, GitHub Actions, build, deployment and reproducibility
    current_actor_type: human
    current_actor: Maxim Bers
    target_actor_type: human
    target_actor: Maxim Bers
    supporting_agent: none
    accountable_human: Maxim Bers
    human_approval_required: true
    implementation_status: planned

  - id: ai_safety_security_engineer
    title: AI Safety & Security Engineer
    responsibility: Tool permissions, guardrails, secrets, prompt and agent risks
    current_actor_type: agent
    current_actor: qa_security_agent (run_security_audit)
    target_actor_type: agent
    target_actor: qa_security_agent
    supporting_agent: qa_security_agent
    accountable_human: Lars Boos
    human_approval_required: true
    implementation_status: operational

  - id: cost_observability_engineer
    title: Cost & Observability Engineer
    responsibility: Traces, runtime, token usage, cost model and cost optimization
    current_actor_type: hybrid
    current_actor: cost_agent (run_cost_analysis)
    target_actor_type: hybrid
    target_actor: cost_agent
    supporting_agent: cost_agent
    accountable_human: Maxim Bers
    human_approval_required: false
    implementation_status: operational
